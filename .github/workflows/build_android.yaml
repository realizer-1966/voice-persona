name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'Android/**'
      - 'native/**'
      - '.github/workflows/build_android.yaml'

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6" > /dev/null

      - name: Show native toolchain
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" || true

      - name: Cache Gradle and native build trees
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            Android/src/.cxx
          key: ${{ runner.os }}-voicepersona-${{ hashFiles('Android/src/**/build.gradle.kts', 'Android/src/gradle/libs.versions.toml', 'Android/src/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-voicepersona-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify native libraries are stripped
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          # The job defaults to Android/src, so address the script from the repo root.
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_native_strip.py" "$APK" "$ANDROID_NDK_HOME"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: Android/src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
